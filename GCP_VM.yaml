- name: Launch GCP VM via Jenkins
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    gcp_project_id: "<your-gcp-project-id>"
    gcp_zone: "us-central1-a"
    machine_type: "e2-medium"
    instance_name: "rucha-jenkins-vm"
    gcp_cred_file: "{{ lookup('env', 'GOOGLE_APPLICATION_CREDENTIALS') }}"

  tasks:
    - name: Provision a GCP VM instance
      google.cloud.gcp_compute_instance:
        name: "{{ instance_name }}"
        machine_type: "{{ machine_type }}"
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: projects/debian-cloud/global/images/family/debian-11
        network_interfaces:
          - network:
              selfLink: "global/networks/default"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        zone: "{{ gcp_zone }}"
        project: "{{ gcp_project_id }}"
        auth_kind: serviceaccount
        service_account_file: "{{ gcp_cred_file }}"
        state: present
      register: vm_info

    - name: Display Public IP
      debug:
        msg: "VM Created. Public IP: {{ vm_info.networkInterfaces[0].accessConfigs[0].natIP }}"
